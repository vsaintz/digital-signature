<div class="w-full h-screen flex bg-background overflow-hidden">
  <dash-sidebar #sidebarRef class="lg:hidden" />

  <div class="hidden lg:flex w-64 shrink-0 border-r border-border h-full">
    <dash-sidebar class="block w-full h-full" />
  </div>

  <div class="flex-1 flex flex-col min-w-0 bg-background-subtle overflow-hidden">
    <header
      class="lg:hidden flex items-center justify-between px-4 py-3 border-b border-border shrink-0 bg-background"
    >
      <button
        (click)="sidebarRef.mobileOpen.set(true)"
        class="w-8 h-8 flex items-center justify-center rounded-md text-foreground-muted hover:bg-hover-background hover:text-foreground transition-colors cursor-pointer"
        aria-label="Open navigation"
      >
        <app-icon name="Menu" [size]="18" />
      </button>
      <div class="flex items-center gap-2">
        <div
          class="w-6 h-6 rounded-md bg-white flex items-center justify-center border border-border"
        >
          <span class="text-xs font-semibold text-black select-none">Dc</span>
        </div>
        <span class="text-xs font-semibold text-foreground">DocuSign Pro</span>
      </div>
      <div class="w-8"></div>
    </header>
    <main class="flex-1 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>

<div class="w-full flex items-center justify-between mb-3">
  <div class="flex gap-2">
    @if (selectedCount > 0) {
      <button
        class="flex gap-1 items-center border border-error-border text-error-text px-2 py-1 text-xs font-medium rounded-md"
        (click)="clearSelection.emit()"
      >
        <app-icon [name]="'X'" [size]="13" />
        Deselect All
      </button>
      <p class="text-xs text-foreground-muted self-center">
        {{ selectedCount }} of {{ totalCount }} selected
      </p>
    }
    <button
      class="flex gap-2 items-center text-xs font-semibold border border-border rounded-md px-2 py-2 cursor-pointer"
    >
      <app-icon [name]="'ListFilter'" [size]="15" /> Filter
    </button>
    <button
      class="flex gap-2 items-center text-xs font-semibold border border-border rounded-md px-2 py-2 cursor-pointer"
    >
      <app-icon [name]="'ArrowUpDown'" [size]="15" /> Sort
    </button>
  </div>
  <div class="flex gap-0.5 items-center">
    <form action="/search" method="get" class="flex items-center gap-2">
      <app-icon [name]="'Search'" [size]="15" />
      <input
        type="search"
        name="q"
        placeholder="Search..."
        class="w-24 text-sm font-medium px-2 py-1 outline-none"
      />
    </form>
  </div>
</div>

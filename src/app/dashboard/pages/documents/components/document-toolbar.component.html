<div class="flex items-center gap-2.5">
  @if (selectedCount > 0) {
    <div class="flex items-center gap-2 flex-1">
      <span class="text-[12.5px] font-medium text-foreground-muted">
        <span class="text-foreground font-semibold">{{ selectedCount }}</span>
        of {{ totalCount }} selected
      </span>
      <div class="w-px h-4 bg-border mx-1"></div>
      <button
        (click)="downloadSelected.emit()"
        class="flex items-center gap-1.5 px-3 py-1.5 text-[12px] font-medium border border-border rounded-lg bg-background text-foreground-muted hover:bg-background-subtle hover:text-foreground transition-colors cursor-pointer"
      >
        <app-icon name="Download" [size]="13" /> Download
      </button>
      <button
        (click)="deleteSelected.emit()"
        class="flex items-center gap-1.5 px-3 py-1.5 text-[12px] font-medium border border-error-border rounded-lg text-error-text hover:bg-error-bg-hover transition-colors cursor-pointer"
      >
        <app-icon name="Trash2" [size]="13" /> Delete
      </button>
      <button
        (click)="clearSelection.emit()"
        class="flex items-center gap-1.5 px-3 py-1.5 text-[12px] font-medium border border-border rounded-lg bg-background text-foreground-muted hover:bg-background-subtle hover:text-foreground transition-colors cursor-pointer ml-auto"
      >
        <app-icon name="X" [size]="12" /> Clear
      </button>
    </div>
  } @else {
    <div class="relative flex-1 max-w-xs">
      <app-icon
        [name]="'Search'"
        [size]="15"
        class="absolute left-3 top-1/2 -translate-y-1/2 text-foreground-muted pointer-events-none"
      />
      <input
        type="text"
        [value]="searchQuery"
        (input)="searchChange.emit($any($event.target).value)"
        placeholder="Search documents…"
        class="w-full pl-9 pr-3.5 py-2 text-[13px] text-foreground bg-background border border-border rounded-lg outline-none placeholder:text-[oklch(0.72_0_0)]"
      />
    </div>

    <div class="flex items-center gap-1.5">
      @for (f of filterOptions; track f.value) {
        <button
          (click)="filterChange.emit(f.value)"
          class="px-3 py-1.5 text-[12px] font-medium rounded-lg border transition-all cursor-pointer
                   {{
            activeFilter === f.value
              ? 'theme-inverse bg-(--background) text-(--foreground)'
              : 'bg-background text-foreground-muted border-border hover:bg-background-subtle hover:text-foreground'
          }}"
        >
          {{ f.label }}
        </button>
      }
    </div>

    <div class="relative hidden sm:block">
      <select
        [value]="sortField"
        (change)="sortChange.emit($any($event.target).value)"
        class="appearance-none pl-3 pr-8 py-2 text-[12.5px] font-medium text-foreground-muted bg-background border border-border rounded-lg outline-none cursor-pointer"
      >
        <option value="date">Last modified</option>
        <option value="name">Name</option>
        <option value="size">File size</option>
        <option value="status">Status</option>
      </select>
      <app-icon
        [name]="'ChevronDown'"
        [size]="15"
        class="absolute right-2.5 top-1/2 -translate-y-1/2 text-foreground-muted pointer-events-none"
      />
    </div>
  }
</div>

<div class="w-full flex-1 p-5">
  <div class="w-full border border-border mb-5">
    <stats-card />
  </div>

  @if (isLoading) {
    <div
      class="flex flex-col items-center gap-3 text-foreground-muted text-sm py-16 justify-center border border-border rounded-md"
    >
      <app-icon [name]="'Loader'" [size]="20" class="animate-spin" />
      <span class="uppercase font-medium tracking-wider font-mono">Loading</span>
    </div>
  }

  @if (!isLoading && documents.length === 0) {
    <div class="flex flex-col items-center justify-center py-24 text-center border border-border">
      <div class="w-12 h-12 bg-background rounded-full flex items-center justify-center mb-4">
        <app-icon [name]="'FileSpreadsheet'" [size]="30" class="text-accent" />
      </div>
      <p class="font-medium text-sm tracking-wider">No documents yet</p>
      <p class="text-foreground-muted text-xs mt-2 font-medium font-mono">
        Upload a file to get started.
      </p>
    </div>
  }

  @if (!isLoading && documents.length > 0) {
    <document-toolbar
      [totalCount]="documents.length"
      [selectedCount]="selectedCount"
      (clearSelection)="clearSelection()"
    />
    <document-table
      [documents]="documents"
      [selectedIds]="selectedIds"
      (toggleOne)="toggleOne($event)"
      (toggleAll)="toggleAll()"
    />
  }
</div>

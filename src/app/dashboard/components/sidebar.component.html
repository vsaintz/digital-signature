@if (showCreateNewOptions()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50"
    (click)="showCreateNewOptions.set(false)"
  >
    <div
      class="bg-background border border-border rounded-xl w-full max-w-3xl p-10 mx-4"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-between mb-7">
        <h2 class="text-sm font-semibold">Create a project</h2>
        <button
          (click)="showCreateNewOptions.set(false)"
          class="text-foreground-muted cursor-pointer"
        >
          <app-icon name="X" [size]="18" />
        </button>
      </div>
      <ul class="flex flex-col gap-2">
        <li class="text-sm font-medium cursor-pointer hover:underline">1. New Project</li>
        <li class="text-sm font-medium cursor-pointer hover:underline">2. New Document</li>
      </ul>
    </div>
  </div>
}

<aside class="w-full h-full flex flex-col p-4">
  <div class="mb-10 px-2">
    <dash-userprofile />
  </div>
  <div class="mb-5">
    <button
      (click)="showCreateNewOptions.set(true)"
      class="w-full flex items-center justify-center gap-2 px-4 py-2 theme-inverse bg-(--background) text-(--foreground) font-medium text-sm rounded-md cursor-pointer"
    >
      Create New
      <app-icon [name]="'Plus'" [size]="15" />
    </button>
  </div>

  <nav class="flex-1 flex flex-col gap-6 overflow-y-auto custom-scrollbar">
    @for (group of navGroups; track group.section) {
      <div class="flex flex-col">
        <div
          (click)="toggleGroup(group)"
          class="group flex items-center justify-between px-2 py-2 cursor-pointer rounded-md hover:bg-muted transition-colors"
        >
          <h3 class="text-[11px] text-foreground-muted uppercase tracking-wider">
            {{ group.section }}
          </h3>
          <app-icon
            [name]="'ChevronDown'"
            [size]="14"
            class="text-foreground-muted transition-transform duration-200"
            [class.rotate-[-90deg]]="!group.isExpanded"
          />
        </div>

        @if (group.isExpanded) {
          <div class="mt-1 flex flex-col gap-1">
            @for (link of group.links; track link.title) {
              <a
                [routerLink]="link.path"
                routerLinkActive="bg-hover-background text-foreground"
                [routerLinkActiveOptions]="{ exact: true }"
                class="flex items-center gap-3 px-3 py-2 text-[13px] text-foreground-muted rounded-lg transition-all hover:bg-hover-background hover:text-foreground group/link"
              >
                <app-icon [name]="link.icon" [size]="18" />
                {{ link.title }}
              </a>
            }
          </div>
        }
      </div>
    }
  </nav>
  <div class="pt-4 border-t border-border">
    <button
      (click)="handleSignOut()"
      class="w-full flex items-center gap-3 px-3 py-2 text-[13px] font-medium text-foreground-muted rounded-lg hover:bg-hover-background hover:text-foreground"
    >
      <app-icon name="LogOut" [size]="18" />
      Log out
    </button>
  </div>
</aside>

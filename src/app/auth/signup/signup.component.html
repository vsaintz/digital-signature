<div class="flex flex-col items-center justify-center min-h-screen bg-gray-50 py-10">
  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="p-8 bg-white shadow-md rounded-lg w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Create Account</h2>

    <div class="space-y-4">
      <input type="email" formControlName="email" placeholder="email" class="w-full p-2 border border-border rounded">
      <input type="password" formControlName="password" placeholder="password" class="w-full p-2 border border-border rounded">

      <div class="grid grid-cols-2 gap-4">
        <input type="text" formControlName="first_name" placeholder="first name" class="p-2 border border-border rounded">
        <input type="text" formControlName="middle_name" placeholder="middle name" class="p-2 border border-border rounded">
      </div>

      <input type="text" formControlName="last_name" placeholder="last name" class="w-full p-2 border border-border rounded">
      <input type="text" formControlName="phone_number" placeholder="phone number" class="w-full p-2 border border-border rounded">

      <button type="submit" class="w-full p-2 rounded-md theme-inverse bg-(--background) text-(--foreground)">Register</button>
    </div>

    <p class="mt-4 text-sm text-center">Already have an account? <a routerLink="/auth/signin" class="underline font-medium">Sign In</a></p>
  </form>
</div>
